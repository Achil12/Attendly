
name: Attendly Auto Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Attendly
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create ZIP Package
        run: |
          git archive \
            --format=zip \
            --output "Attendly-${GITHUB_REF_NAME}.zip" \
            HEAD

      - name: Generate GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Attendly ${{ github.ref_name }}"
          generate_release_notes: true
          files: Attendly-${{ github.ref_name }}.zip
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
